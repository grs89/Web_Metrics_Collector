# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Secrets
# Supports: Nginx, Apache
# ═══════════════════════════════════════════════════════════════════════════
# ⚠️  IMPORTANTE: Este archivo es solo un ejemplo/template.
#     NO almacenes contraseñas reales en control de versiones.
#     Usa Sealed Secrets, External Secrets o Vault en producción.
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: Secret
metadata:
  name: wgp-secrets
  namespace: wgp
  labels:
    app.kubernetes.io/name: wgp
    app.kubernetes.io/part-of: web-geo-profiler
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: "wgp_user"
  POSTGRES_PASSWORD: "wgp_secure_password_2024"  # ⚠️ CAMBIAR EN PRODUCCIÓN
  POSTGRES_DB: "web_logs"
  
  # Grafana
  GRAFANA_USER: "admin"
  GRAFANA_PASSWORD: "admin123"  # ⚠️ CAMBIAR EN PRODUCCIÓN
  
  # Log Processor
  DEFAULT_SERVER_TYPE: "nginx"  # 'nginx' or 'apache'
