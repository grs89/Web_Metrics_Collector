# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Secrets
# PULL-based Architecture
# ═══════════════════════════════════════════════════════════════════════════
# IMPORTANT: For production, use:
#   - Sealed Secrets (Bitnami)
#   - External Secrets Operator
#   - HashiCorp Vault
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: Secret
metadata:
  name: wgp-secrets
  namespace: wgp
  labels:
    app.kubernetes.io/name: wgp-secrets
    app.kubernetes.io/part-of: web-geo-profiler
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: "wgp_user"
  POSTGRES_PASSWORD: "wgp_secure_password_2024"  # CHANGE IN PRODUCTION!
  POSTGRES_DB: "web_logs"
  
  # Grafana
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "admin123"  # CHANGE IN PRODUCTION!

---
# ═══════════════════════════════════════════════════════════════════════════
# SSH Key Secret for PULL-based log collection
# ═══════════════════════════════════════════════════════════════════════════
# Create this secret with your SSH private key:
#
#   ssh-keygen -t rsa -b 4096 -f ./id_rsa -N ""
#   kubectl create secret generic wgp-ssh-key \
#     --from-file=id_rsa=./id_rsa \
#     -n wgp
#
# Then copy the public key to each web server:
#   ssh-copy-id -i ./id_rsa.pub wgp@YOUR_SERVER_IP
# ═══════════════════════════════════════════════════════════════════════════
# apiVersion: v1
# kind: Secret
# metadata:
#   name: wgp-ssh-key
#   namespace: wgp
# type: Opaque
# data:
#   id_rsa: <base64-encoded-private-key>
