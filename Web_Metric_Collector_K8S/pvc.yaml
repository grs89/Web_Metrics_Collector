# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Persistent Volume Claims
# PULL-based Architecture
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: wgp
  labels:
    app.kubernetes.io/name: postgres-data
    app.kubernetes.io/part-of: web-geo-profiler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: standard  # Uncomment for cloud providers

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: wgp
  labels:
    app.kubernetes.io/name: grafana-data
    app.kubernetes.io/part-of: web-geo-profiler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-processor-data-pvc
  namespace: wgp
  labels:
    app.kubernetes.io/name: log-processor-data
    app.kubernetes.io/part-of: web-geo-profiler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
