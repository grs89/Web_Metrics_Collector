# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Log Processor Deployment
# PULL-based Architecture via SSH
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: wgp
  labels:
    app.kubernetes.io/name: log-processor
    app.kubernetes.io/part-of: web-geo-profiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        app.kubernetes.io/name: log-processor
        app.kubernetes.io/part-of: web-geo-profiler
    spec:
      initContainers:
        # Esperar a que PostgreSQL esté listo
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - 'sh'
            - '-c'
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: log-processor
          image: ghcr.io/tu-org/wgp-log-processor:latest
          imagePullPolicy: Always
          env:
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wgp-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wgp-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: wgp-secrets
                  key: POSTGRES_DB
            - name: GEOIP_DB
              value: "/app/geoip/GeoLite2-City.mmdb"
            - name: HOSTS_CONFIG
              value: "/app/config/hosts.yml"
            - name: POSITION_FILE
              value: "/app/data/positions.json"
          volumeMounts:
            # SSH key for remote server access
            - name: ssh-key
              mountPath: /app/ssh
              readOnly: true
            # Hosts configuration
            - name: hosts-config
              mountPath: /app/config
              readOnly: true
            # Position tracking (persistent)
            - name: position-data
              mountPath: /app/data
            # GeoIP database (optional)
            - name: geoip-data
              mountPath: /app/geoip
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: ssh-key
          secret:
            secretName: wgp-ssh-key
            defaultMode: 0400
        - name: hosts-config
          configMap:
            name: wgp-hosts-config
        - name: position-data
          persistentVolumeClaim:
            claimName: log-processor-data-pvc
        - name: geoip-data
          emptyDir: {}
