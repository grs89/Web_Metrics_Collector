# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - ConfigMaps
# PULL-based Architecture
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wgp-hosts-config
  namespace: wgp
  labels:
    app.kubernetes.io/name: wgp-config
    app.kubernetes.io/part-of: web-geo-profiler
data:
  hosts.yml: |
    # ═══════════════════════════════════════════════════════════════════════════
    # WGP - Remote Hosts Configuration
    # Define web servers to collect logs from via SSH
    # ═══════════════════════════════════════════════════════════════════════════
    
    global:
      pull_interval: 30
      ssh_timeout: 10
      ssh_key_path: /app/ssh/id_rsa
      ssh_user: wgp
    
    hosts:
      # ─────────────────────────────────────────────────────────────────────────
      # Example Nginx Server - UPDATE WITH YOUR SERVERS
      # ─────────────────────────────────────────────────────────────────────────
      - name: nginx-server-1
        enabled: false  # Enable when configured
        host: 192.168.1.10
        port: 22
        server_type: nginx
        log_paths:
          - /var/log/nginx/access.log
        log_format: json
    
      # ─────────────────────────────────────────────────────────────────────────
      # Example Apache Server
      # ─────────────────────────────────────────────────────────────────────────
      - name: apache-server-1
        enabled: false
        host: 192.168.1.11
        port: 22
        server_type: apache
        log_paths:
          - /var/log/apache2/access.log
        log_format: combined

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: wgp
  labels:
    app.kubernetes.io/name: grafana-dashboards
    app.kubernetes.io/part-of: web-geo-profiler
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: wgp
  labels:
    app.kubernetes.io/name: grafana-datasources
    app.kubernetes.io/part-of: web-geo-profiler
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: PostgreSQL
        type: postgres
        uid: wgp-postgres
        url: postgres-service:5432
        database: web_logs
        user: wgp_user
        secureJsonData:
          password: wgp_secure_password_2024
        jsonData:
          sslmode: disable
          maxOpenConns: 10
          maxIdleConns: 5
          connMaxLifetime: 14400
          postgresVersion: 1600
          timescaledb: false
        isDefault: true
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: wgp
  labels:
    app.kubernetes.io/name: postgres-init
    app.kubernetes.io/part-of: web-geo-profiler
data:
  01-schema.sql: |
    -- ═══════════════════════════════════════════════════════════════════════════
    -- WGP - Web Access Logs Schema (Multi-server: Nginx + Apache, Multi-host)
    -- ═══════════════════════════════════════════════════════════════════════════
    
    CREATE TABLE IF NOT EXISTS web_access_logs (
        id BIGSERIAL PRIMARY KEY,
        timestamp TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        server_type VARCHAR(20) NOT NULL DEFAULT 'nginx',
        source_host VARCHAR(255),
        remote_addr INET,
        remote_user VARCHAR(255),
        request_method VARCHAR(50),
        request_uri TEXT,
        request TEXT,
        status SMALLINT,
        body_bytes_sent BIGINT,
        request_time FLOAT,
        request_length BIGINT,
        http_referer TEXT,
        http_user_agent TEXT,
        http_x_forwarded_for VARCHAR(255),
        host VARCHAR(255),
        server_name VARCHAR(255),
        upstream_addr VARCHAR(255),
        upstream_response_time VARCHAR(255),
        ssl_protocol VARCHAR(20),
        ssl_cipher VARCHAR(100),
        connection BIGINT,
        connection_requests BIGINT,
        gzip_ratio VARCHAR(20),
        country_code VARCHAR(2),
        country_name VARCHAR(100),
        city VARCHAR(100),
        region VARCHAR(100),
        latitude FLOAT,
        longitude FLOAT,
        timezone VARCHAR(50)
    );
    
    -- Indexes
    CREATE INDEX IF NOT EXISTS idx_logs_timestamp ON web_access_logs (timestamp DESC);
    CREATE INDEX IF NOT EXISTS idx_logs_server_type ON web_access_logs (server_type);
    CREATE INDEX IF NOT EXISTS idx_logs_source_host ON web_access_logs (source_host);
    CREATE INDEX IF NOT EXISTS idx_logs_status ON web_access_logs (status);
    CREATE INDEX IF NOT EXISTS idx_logs_remote_addr ON web_access_logs (remote_addr);
    CREATE INDEX IF NOT EXISTS idx_logs_country ON web_access_logs (country_code);
    
    -- Host Summary View
    CREATE OR REPLACE VIEW v_host_summary AS
    SELECT 
        COALESCE(source_host, 'unknown') AS source_host,
        server_type,
        COUNT(*) AS total_requests,
        COUNT(*) FILTER (WHERE status >= 400) AS error_count,
        COUNT(DISTINCT remote_addr) AS unique_ips,
        COUNT(DISTINCT country_code) AS countries,
        ROUND(AVG(request_time)::numeric, 3) AS avg_response
    FROM web_access_logs
    WHERE timestamp > NOW() - INTERVAL '24 hours'
    GROUP BY source_host, server_type
    ORDER BY total_requests DESC;
    
    -- Grant permissions
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO wgp_user;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO wgp_user;
