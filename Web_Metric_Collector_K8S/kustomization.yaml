# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Kustomization
# PULL-based Architecture (no Logstash)
# ═══════════════════════════════════════════════════════════════════════════
# Desplegar con: kubectl apply -k .
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wgp

resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - pvc.yaml
  - postgres-deployment.yaml
  - log-processor-deployment.yaml
  - grafana-deployment.yaml
  - retention-cronjob.yaml
  # - ingress.yaml  # Descomentar si usas Ingress

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "2.0.0"

images:
  - name: postgres
    newTag: 16-alpine
  - name: grafana/grafana
    newTag: latest
