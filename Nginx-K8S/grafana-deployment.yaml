# ═══════════════════════════════════════════════════════════════════════════
# NGP - Nginx Geo Profiler - Grafana Deployment
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ngp
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: nginx-geo-profiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: nginx-geo-profiler
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      initContainers:
        # Esperar a que PostgreSQL esté listo
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - 'sh'
            - '-c'
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: ngp-secrets
                  key: GRAFANA_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngp-secrets
                  key: GRAFANA_PASSWORD
            - name: GF_INSTALL_PLUGINS
              value: "grafana-worldmap-panel,grafana-clock-panel,grafana-piechart-panel"
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:3000"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngp-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboards
          emptyDir: {}  # Para producción, montar el dashboard JSON como ConfigMap
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: ngp
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: nginx-geo-profiler
spec:
  type: LoadBalancer  # Cambiar a NodePort o ClusterIP + Ingress según necesidad
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana

