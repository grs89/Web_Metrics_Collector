# ═══════════════════════════════════════════════════════════════════════════
# NGP - Nginx Geo Profiler - Secrets
# ═══════════════════════════════════════════════════════════════════════════
# ⚠️  IMPORTANTE: Este archivo es solo un ejemplo/template.
#     NO almacenes contraseñas reales en control de versiones.
#     Usa Sealed Secrets, External Secrets o Vault en producción.
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: Secret
metadata:
  name: ngp-secrets
  namespace: ngp
  labels:
    app.kubernetes.io/name: ngp
    app.kubernetes.io/part-of: nginx-geo-profiler
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: "ngp_user"
  POSTGRES_PASSWORD: "ngp_secure_password_2024"  # ⚠️ CAMBIAR EN PRODUCCIÓN
  POSTGRES_DB: "nginx_logs"
  
  # Grafana
  GRAFANA_USER: "admin"
  GRAFANA_PASSWORD: "admin123"  # ⚠️ CAMBIAR EN PRODUCCIÓN

