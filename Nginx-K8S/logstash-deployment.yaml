# ═══════════════════════════════════════════════════════════════════════════
# NGP - Nginx Geo Profiler - Logstash Deployment
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: ngp
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: nginx-geo-profiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
        app.kubernetes.io/name: logstash
        app.kubernetes.io/part-of: nginx-geo-profiler
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.1
          ports:
            - containerPort: 5044
              name: beats
            - containerPort: 5000
              name: tcp
              protocol: TCP
            - containerPort: 5000
              name: udp
              protocol: UDP
            - containerPort: 9600
              name: api
          env:
            - name: LS_JAVA_OPTS
              value: "-Xmx512m -Xms512m"
          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: logstash-config
              mountPath: /usr/share/logstash/pipeline/nginx.conf
              subPath: nginx.conf
            - name: logstash-data
              mountPath: /usr/share/logstash/data
            - name: logstash-logs
              mountPath: /usr/share/logstash/data/nginx-logs
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: logstash-config
          configMap:
            name: logstash-config
        - name: logstash-data
          persistentVolumeClaim:
            claimName: logstash-data-pvc
        - name: logstash-logs
          persistentVolumeClaim:
            claimName: logstash-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: logstash-service
  namespace: ngp
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: nginx-geo-profiler
spec:
  type: LoadBalancer  # Cambiar a NodePort o ClusterIP según necesidad
  ports:
    - port: 5044
      targetPort: 5044
      name: beats
      protocol: TCP
    - port: 5000
      targetPort: 5000
      name: tcp
      protocol: TCP
  selector:
    app: logstash

