# ═══════════════════════════════════════════════════════════════════════════
# NGP - Nginx Geo Profiler - Kustomization
# ═══════════════════════════════════════════════════════════════════════════
# Permite desplegar todos los recursos con: kubectl apply -k .
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ngp

resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - pvc.yaml
  - postgres-deployment.yaml
  - logstash-deployment.yaml
  - log-processor-deployment.yaml
  - grafana-deployment.yaml
  - retention-cronjob.yaml
  # - ingress.yaml  # Descomentar si usas Ingress

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.0.0"

# Configuración común de imágenes (para actualizar versiones fácilmente)
images:
  - name: postgres
    newTag: 16-alpine
  - name: docker.elastic.co/logstash/logstash
    newTag: 8.11.1
  - name: grafana/grafana
    newTag: latest

