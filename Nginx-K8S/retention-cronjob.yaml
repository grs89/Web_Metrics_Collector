# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Retention Manager CronJob
# Supports: Nginx, Apache
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention-manager
  namespace: wgp
  labels:
    app.kubernetes.io/name: retention-manager
    app.kubernetes.io/part-of: web-geo-profiler
spec:
  # Ejecutar todos los días a las 3 AM
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: retention-manager
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention-manager
              image: postgres:16-alpine
              env:
                - name: PGHOST
                  value: "postgres-service"
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: wgp-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wgp-secrets
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: wgp-secrets
                      key: POSTGRES_DB
                - name: RETENTION_DAYS
                  value: "365"
              command:
                - /bin/sh
                - -c
                - |
                  echo "[$(date)] Starting retention cleanup..."
                  
                  # Ejecutar limpieza
                  psql -c "
                    SELECT 'Before cleanup: ' || COUNT(*) || ' records' 
                    FROM web_access_logs;
                    
                    DELETE FROM web_access_logs 
                    WHERE timestamp < NOW() - INTERVAL '${RETENTION_DAYS} days';
                    
                    DELETE FROM web_metrics_hourly 
                    WHERE hour < NOW() - INTERVAL '${RETENTION_DAYS} days';
                    
                    SELECT 'After cleanup: ' || COUNT(*) || ' records' 
                    FROM web_access_logs;
                  "
                  
                  echo "[$(date)] Retention cleanup completed!"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
