# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Filebeat Configuration for Remote Web Server
# Supports: Nginx, Apache
# ═══════════════════════════════════════════════════════════════════════════
#
# INSTRUCTIONS:
# 1. Copy this file to your web server (Nginx or Apache)
# 2. Install Filebeat: https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-installation.html
# 3. Edit the 'hosts' field below with your WGP server IP
# 4. Adjust log paths for your server type (Nginx or Apache)
# 5. Start Filebeat: sudo systemctl start filebeat
#
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
# Filebeat inputs - NGINX
# ═══════════════════════════════════════════════════════════════════════════
filebeat.inputs:
  # Nginx access logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
      - /var/log/nginx/*access*.log
    
    # JSON parsing (if using JSON log format)
    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: message
    
    # Identify source and server type
    fields:
      log_type: nginx_access
      host_name: "${HOSTNAME}"
    fields_under_root: true

  # Apache access logs (uncomment if using Apache)
  # - type: log
  #   enabled: true
  #   paths:
  #     - /var/log/apache2/access.log
  #     - /var/log/apache2/*access*.log
  #     - /var/log/httpd/access_log
  #     - /var/log/httpd/*access*.log
  #   
  #   # JSON parsing (if using JSON log format)
  #   json.keys_under_root: true
  #   json.add_error_key: true
  #   json.message_key: message
  #   
  #   # Identify source and server type
  #   fields:
  #     log_type: apache_access
  #     host_name: "${HOSTNAME}"
  #   fields_under_root: true

# ═══════════════════════════════════════════════════════════════════════════
# Processors - Add host metadata (IMPORTANT for multi-host support)
# ═══════════════════════════════════════════════════════════════════════════
processors:
  # This adds host.name which is used to identify the source server
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  
  # Drop health check logs (optional)
  - drop_event:
      when:
        or:
          - contains:
              request_uri: "/health"
          - contains:
              request_uri: "/ping"
          - contains:
              request_uri: "/status"

# ═══════════════════════════════════════════════════════════════════════════
# Output to Logstash on WGP Server
# ═══════════════════════════════════════════════════════════════════════════
output.logstash:
  # ⚠️ CHANGE THIS to your WGP server IP address or hostname
  hosts: ["YOUR_WGP_SERVER_IP:5044"]
  
  # SSL/TLS (optional, recommended for production)
  # ssl.enabled: true
  # ssl.certificate_authorities: ["/etc/filebeat/ca.crt"]
  # ssl.certificate: "/etc/filebeat/client.crt"
  # ssl.key: "/etc/filebeat/client.key"
  
  # Load balancing (useful for HA setups)
  loadbalance: true
  
  # Retry settings
  backoff.init: 1s
  backoff.max: 60s

# ═══════════════════════════════════════════════════════════════════════════
# Logging
# ═══════════════════════════════════════════════════════════════════════════
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0640

# ═══════════════════════════════════════════════════════════════════════════
# Monitoring (optional)
# ═══════════════════════════════════════════════════════════════════════════
monitoring.enabled: false
