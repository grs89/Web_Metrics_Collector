# ═══════════════════════════════════════════════════════════════════════════
# WGP - Grafana Datasources Configuration
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: wgp-postgres
    url: postgres:5432
    database: web_logs
    user: wgp_user
    secureJsonData:
      password: wgp_secure_password_2024
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
