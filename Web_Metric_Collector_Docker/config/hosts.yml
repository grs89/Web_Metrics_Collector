# ═══════════════════════════════════════════════════════════════════════════
# WGP - Remote Hosts Configuration
# Define web servers to collect logs from via SSH
# ═══════════════════════════════════════════════════════════════════════════

# Global settings
global:
  # How often to pull logs (seconds)
  pull_interval: 30
  
  # SSH connection timeout (seconds)
  ssh_timeout: 10
  
  # Default SSH key path (can be overridden per host)
  ssh_key_path: /app/ssh/id_rsa
  
  # Default SSH user (can be overridden per host)
  ssh_user: wgp

# Remote hosts to collect logs from
hosts:
  # ─────────────────────────────────────────────────────────────────────────
  # Example Nginx Server
  # ─────────────────────────────────────────────────────────────────────────
  - name: nginx-server-1
    enabled: true
    host: 192.168.1.10
    port: 22
    # ssh_user: wgp  # Optional: override global user
    # ssh_key_path: /app/ssh/custom_key  # Optional: override global key
    server_type: nginx
    log_paths:
      - /var/log/nginx/access.log
    # Optional: log format (json or combined)
    log_format: json

  # ─────────────────────────────────────────────────────────────────────────
  # Example Apache Server  
  # ─────────────────────────────────────────────────────────────────────────
  - name: apache-server-1
    enabled: false  # Disabled by default - enable when configured
    host: 192.168.1.11
    port: 22
    server_type: apache
    log_paths:
      - /var/log/apache2/access.log
      - /var/log/httpd/access_log
    log_format: combined

  # ─────────────────────────────────────────────────────────────────────────
  # Example: Multiple log files from one server
  # ─────────────────────────────────────────────────────────────────────────
  - name: multi-site-server
    enabled: false
    host: 192.168.1.12
    port: 22
    server_type: nginx
    log_paths:
      - /var/log/nginx/site1-access.log
      - /var/log/nginx/site2-access.log
      - /var/log/nginx/api-access.log
    log_format: json

# ═══════════════════════════════════════════════════════════════════════════
# Setup Instructions:
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. On EACH remote server, create a 'wgp' user:
#    sudo useradd -m -s /bin/bash wgp
#
# 2. Add wgp user to the group that can read logs:
#    sudo usermod -aG adm wgp      # Debian/Ubuntu
#    sudo usermod -aG apache wgp   # RHEL/CentOS (Apache)
#    sudo usermod -aG nginx wgp    # RHEL/CentOS (Nginx)
#
# 3. Generate SSH key on WGP server:
#    ssh-keygen -t rsa -b 4096 -f ./ssh/id_rsa -N ""
#
# 4. Copy public key to each remote server:
#    ssh-copy-id -i ./ssh/id_rsa.pub wgp@192.168.1.10
#
# 5. Test connection:
#    ssh -i ./ssh/id_rsa wgp@192.168.1.10 "tail -1 /var/log/nginx/access.log"
#
# 6. Enable the host in this config file and restart WGP
#
# ═══════════════════════════════════════════════════════════════════════════
