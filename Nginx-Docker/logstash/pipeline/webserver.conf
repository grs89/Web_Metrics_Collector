# ═══════════════════════════════════════════════════════════════════════════
# WGP - Web Geo Profiler - Logstash Pipeline
# Supports: Nginx, Apache
# ═══════════════════════════════════════════════════════════════════════════

input {
  # Filebeat input (recommended)
  beats {
    port => 5044
    host => "0.0.0.0"
  }
  
  # TCP input (alternative)
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # UDP input (alternative for syslog)
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # ═══════════════════════════════════════════════════════════════════════════
  # Detect server type from log_type field or input source
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Default server type
  if ![log_type] {
    mutate {
      add_field => { "log_type" => "nginx_access" }
    }
  }
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Parse JSON if the message is JSON formatted (Nginx/Apache JSON logs)
  # ═══════════════════════════════════════════════════════════════════════════
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "weblog"
    }
  }
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Parse Apache Combined Log Format if not JSON
  # Format: %h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-agent}i"
  # ═══════════════════════════════════════════════════════════════════════════
  if ![weblog] and [log_type] =~ /apache/ {
    grok {
      match => { 
        "message" => '%{IPORHOST:remote_addr} %{USER:ident} %{USER:remote_user} \[%{HTTPDATE:timestamp}\] "(?:%{WORD:request_method} %{NOTSPACE:request_uri}(?: HTTP/%{NUMBER:http_version})?|%{DATA:rawrequest})" %{NUMBER:status} (?:%{NUMBER:body_bytes_sent}|-)( "%{DATA:http_referer}")?( "%{DATA:http_user_agent}")?'
      }
      target => "weblog"
    }
    
    if [weblog][timestamp] {
      date {
        match => [ "[weblog][timestamp]", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target => "@timestamp"
      }
    }
  }
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Parse Nginx JSON logs - extract timestamp
  # ═══════════════════════════════════════════════════════════════════════════
  if [weblog][timestamp] and [log_type] =~ /nginx/ {
    date {
      match => [ "[weblog][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Normalize fields for the log processor
  # ═══════════════════════════════════════════════════════════════════════════
  mutate {
    add_field => {
      "log_timestamp" => "%{[weblog][timestamp]}"
      "remote_addr" => "%{[weblog][remote_addr]}"
      "request_method" => "%{[weblog][request_method]}"
      "request_uri" => "%{[weblog][request_uri]}"
      "status" => "%{[weblog][status]}"
      "body_bytes_sent" => "%{[weblog][body_bytes_sent]}"
      "http_referer" => "%{[weblog][http_referer]}"
      "http_user_agent" => "%{[weblog][http_user_agent]}"
    }
  }
  
  # Add request_time if available (Nginx specific, Apache uses %D or %T)
  if [weblog][request_time] {
    mutate {
      add_field => { "request_time" => "%{[weblog][request_time]}" }
    }
  }
  
  # Add Apache-specific time fields
  if [weblog][D] {
    # Apache %D is in microseconds, convert to seconds
    ruby {
      code => "
        microseconds = event.get('[weblog][D]').to_f
        event.set('request_time', microseconds / 1000000.0)
      "
    }
  }
  
  if [weblog][T] {
    mutate {
      add_field => { "request_time" => "%{[weblog][T]}" }
    }
  }
  
  # Add X-Forwarded-For if available
  if [weblog][http_x_forwarded_for] {
    mutate {
      add_field => { "http_x_forwarded_for" => "%{[weblog][http_x_forwarded_for]}" }
    }
  }
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Convert numeric fields
  # ═══════════════════════════════════════════════════════════════════════════
  mutate {
    convert => {
      "status" => "integer"
      "body_bytes_sent" => "integer"
      "request_time" => "float"
    }
  }
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Clean up intermediate fields
  # ═══════════════════════════════════════════════════════════════════════════
  mutate {
    remove_field => ["message", "agent", "ecs", "input", "tags"]
  }
}

output {
  # Output to file for log-processor to read
  file {
    path => "/usr/share/logstash/data/webserver-logs/access.log"
    codec => json_lines
  }
  
  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}
