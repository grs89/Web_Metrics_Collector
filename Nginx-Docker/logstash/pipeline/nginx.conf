# ═══════════════════════════════════════════════════════════════════════════
# NGP - Logstash Pipeline for Nginx Logs
# ═══════════════════════════════════════════════════════════════════════════

input {
  # Filebeat input (recommended)
  beats {
    port => 5044
    host => "0.0.0.0"
  }
  
  # TCP input (alternative)
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # UDP input (alternative for syslog)
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON if the message is JSON formatted
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "nginx"
    }
  }
  
  # If coming from Filebeat with JSON logs
  if [nginx][timestamp] {
    date {
      match => [ "[nginx][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # Extract fields for the log processor
  mutate {
    add_field => {
      "log_timestamp" => "%{[nginx][timestamp]}"
      "remote_addr" => "%{[nginx][remote_addr]}"
      "request_method" => "%{[nginx][request_method]}"
      "request_uri" => "%{[nginx][request_uri]}"
      "status" => "%{[nginx][status]}"
      "body_bytes_sent" => "%{[nginx][body_bytes_sent]}"
      "request_time" => "%{[nginx][request_time]}"
      "http_referer" => "%{[nginx][http_referer]}"
      "http_user_agent" => "%{[nginx][http_user_agent]}"
      "http_x_forwarded_for" => "%{[nginx][http_x_forwarded_for]}"
    }
  }
  
  # Convert numeric fields
  mutate {
    convert => {
      "status" => "integer"
      "body_bytes_sent" => "integer"
      "request_time" => "float"
    }
  }
}

output {
  # Output to file for log-processor to read
  file {
    path => "/usr/share/logstash/data/nginx-logs/access.log"
    codec => json_lines
  }
  
  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}

