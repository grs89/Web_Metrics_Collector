apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - grafana.yaml
  - log_processor.yaml

configMapGenerator:
  - name: wmc-init-sql
    files:
      - init.sql=../database/init.sql
  - name: wmc-config
    files:
      - hosts.yml=../hosts.yml
  - name: wmc-grafana-datasources
    files:
      - ../grafana/provisioning/datasources/datasources.yml
  - name: wmc-grafana-dashboards
    files:
      - ../grafana/provisioning/dashboards/dashboards.yml

# Example Secret Generator - in production use sealed-secrets or external-secrets
secretGenerator:
  - name: wmc-secrets
    literals:
      - POSTGRES_PASSWORD=wmc_password
      - GRAFANA_ADMIN_PASSWORD=admin
      - GEOIP_LICENSE_KEY=your_license_key_here
  - name: wmc-ssh-keys
    files:
      - ../keys/id_rsa

