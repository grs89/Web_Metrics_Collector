apiVersion: v1
kind: Secret
metadata:
  name: wmc-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change_me_production_password"
  GRAFANA_ADMIN_PASSWORD: "change_me_admin_password"
  GEOIP_LICENSE_KEY: "your_actual_license_key"
---
apiVersion: v1
kind: Secret
metadata:
  name: wmc-ssh-keys
type: Opaque
data:
  # cat keys/id_rsa | base64
  id_rsa: "base64_encoded_private_key_here"
