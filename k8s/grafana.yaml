apiVersion: apps/v1
kind: Deployment
metadata:
  name: wmc-grafana
spec:
  selector:
    matchLabels:
      app: wmc-grafana
  template:
    metadata:
      labels:
        app: wmc-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.0.0
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wmc-secrets
              key: GRAFANA_ADMIN_PASSWORD
        - name: GF_INSTALL_PLUGINS
          value: "grafana-worldmap-panel,grafana-clock-panel,volkovlabs-echarts-panel"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards-json
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: wmc-grafana-pvc
      - name: grafana-datasources
        configMap:
          name: wmc-grafana-datasources
      - name: grafana-dashboards
        configMap:
          name: wmc-grafana-dashboards
      - name: grafana-dashboards-json
        configMap:
          name: wmc-grafana-dashboards-json
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wmc-grafana-pvc
spec:
  storageClassName: nfs-client # Replace with your actual StorageClass name
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wmc-grafana
spec:
  selector:
    app: wmc-grafana
  ports:
  - port: 3000
    targetPort: 3000
    name: http

